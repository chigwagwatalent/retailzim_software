<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3EB5F9"/>
      <stop offset="55%" stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <clipPath id="roundClip">
      <rect width="512" height="512" rx="108"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>

  <!-- White diagonal receipt strip -->
  <g transform="translate(258,248) rotate(-33)">
    <rect x="-54" y="-182" width="108" height="290" rx="20" fill="white"/>
  </g>

  <!-- Yellow downward-pointing triangle -->
  <polygon points="210,188 256,106 302,188" fill="#FFD600"/>

  <!-- Dark navy arc (bottom — sync / motion ring) -->
  <path d="M 148,362 A 116,100 0 0 0 364,336"
        fill="none" stroke="#0A2760" stroke-width="48" stroke-linecap="round"/>

  <!-- Subtle inner highlight on white strip top edge -->
  <g transform="translate(258,248) rotate(-33)">
    <rect x="-54" y="-182" width="108" height="22" rx="10" fill="white" opacity="0.35"/>
  </g>
</svg>
