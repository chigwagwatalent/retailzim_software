spring:
  application:
    name: RetailZW SaaS Platform

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/retail_zw_v?useSSL=false&serverTimezone=Africa/Harare&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:espus}
    password: ${DB_PASSWORD:@cHigwagwa1t@}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: RetailZW-HikariPool

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html

  mail:
    host: ${MAIL_HOST:mail.retailzw.co.zw}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:support@retailzw.co.zw}
    password: ${MAIL_PASSWORD:cHigwagwa1t}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 15000
          writetimeout: 15000

  cache:
    type: simple

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

management:
  health:
    mail:
      enabled: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json
  error:
    whitelabel:
      enabled: false

jwt:
  secret: ${JWT_SECRET:RetailZW-SaaS-Super-Secret-Key-2024-Zimbabwe-Retail-Platform-Key-Must-Be-Long-Enough}
  access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:604800000}
  refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:604800000}

app:
  name: RetailZW
  version: 1.0.0
  base-url: ${APP_BASE_URL:https://retailzw.co.zw}
  currencies:
    - code: USD
      name: US Dollar
      symbol: "$"
    - code: ZWG
      name: Zimbabwe Gold
      symbol: ZWG
  default-currency: USD
  default-timezone: Africa/Harare
  upload-dir: ${UPLOAD_DIR:uploads/}
  max-login-attempts: 5
  lockout-duration-minutes: 15
  session-timeout-minutes: 5
  support-email: support@retailzw.co.zw
  mail:
    from-name: ${MAIL_FROM_NAME:RetailZW}
    support-from: ${MAIL_SUPPORT_FROM:support@retailzw.co.zw}
    support-password: ${MAIL_SUPPORT_PASSWORD:${MAIL_PASSWORD:cHigwagwa1t}}
    billing-from: ${MAIL_BILLING_FROM:sales@retailzw.co.zw}
    billing-password: ${MAIL_BILLING_PASSWORD:${MAIL_PASSWORD:cHigwagwa1t}}
    notifications-from: ${MAIL_NOTIFICATIONS_FROM:info@retailzw.co.zw}
    notifications-password: ${MAIL_NOTIFICATIONS_PASSWORD:${MAIL_PASSWORD:cHigwagwa1t}}
    reply-to: ${MAIL_REPLY_TO:support@retailzw.co.zw}

smilepay:
  base-url: ${SMILEPAY_BASE_URL:https://zbnet.zb.co.zw/wallet_gateway/payments-gateway}
  api-key: ${SMILEPAY_API_KEY:66ab728f-563b-4a4e-9fc7-1743e549aa66}
  api-secret: ${SMILEPAY_API_SECRET:c4b74356-55e8-45d2-b0ea-a132e3895784}

billing:
  reminder-days: ${BILLING_REMINDER_DAYS:14,7,3,1,0,-1,-3}
  reminder-cron: "${BILLING_REMINDER_CRON:0 0 8 * * *}"
  grace-days: ${BILLING_GRACE_DAYS:3}

logging:
  level:
    root: INFO
    com.retailzw: INFO
    com.retailzw.controller.api.ApiExceptionHandler: WARN
    com.retailzw.config.RequestLoggingFilter: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    com.zaxxer.hikari: INFO
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{50} - %msg%n"
  file:
    name: logs/retailzw.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/retailzw-%d{yyyy-MM-dd}.%i.log
      max-file-size: 20MB
      max-history: 30
      total-size-cap: 1GB
