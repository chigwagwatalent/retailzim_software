# Production overrides: all credentials come from the deployment environment.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 15000
          writetimeout: 15000

  cache:
    type: simple

  servlet:
    multipart:
      max-file-size: ${RETAILZW_MULTIPART_MAX_FILE_SIZE:300MB}
      max-request-size: ${RETAILZW_MULTIPART_MAX_REQUEST_SIZE:310MB}


server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax

jwt:
  secret: ${JWT_SECRET}

app:
  allowed-origins: ${APP_ALLOWED_ORIGINS}
  base-url: ${APP_BASE_URL}
  upload-dir: ${RETAILZW_UPLOAD_DIR:uploads/}
  release-upload-dir: ${RETAILZW_RELEASE_UPLOAD_DIR:uploads/releases}
  mail:
    support-password: ${MAIL_SUPPORT_PASSWORD:${MAIL_PASSWORD}}
    billing-password: ${MAIL_BILLING_PASSWORD:${MAIL_PASSWORD}}
    notifications-password: ${MAIL_NOTIFICATIONS_PASSWORD:${MAIL_PASSWORD}}

smilepay:
  api-key: ${SMILEPAY_API_KEY}
  api-secret: ${SMILEPAY_API_SECRET}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
