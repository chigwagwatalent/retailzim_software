spring:
  application:
    name: RetailZW SaaS Platform

  datasource:
    url: jdbc:mysql://localhost:3306/retail_zw?useSSL=false&serverTimezone=Africa/Harare&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: cHigwagwa1t
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: RetailZW-HikariPool

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  thymeleaf:
    cache: true
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html

  mail:
    host: mail.retailzw.co.zw
    port: 587
    username: support@retailzw.co.zw
    password: ${MAIL_PASSWORD:cHigwagwa1t}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 15000
          writetimeout: 15000

  cache:
    type: simple

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

management:
  health:
    mail:
      enabled: false

server:
  port: 8080
  address: 0.0.0.0
  forward-headers-strategy: framework
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json
  error:
    whitelabel:
      enabled: false

jwt:
  secret: RetailZW-SaaS-Super-Secret-Key-2024-Zimbabwe-Retail-Platform-Key-Must-Be-Long-Enough
  access-token-expiry: 604800000
  refresh-token-expiry: 604800000

app:
  name: RetailZW
  version: 1.0.0
  base-url: http://localhost:8080
  currencies:
    - code: USD
      name: US Dollar
      symbol: "$"
    - code: ZWG
      name: Zimbabwe Gold
      symbol: ZWG
  default-currency: USD
  default-timezone: Africa/Harare
  upload-dir: uploads/
  max-login-attempts: 5
  lockout-duration-minutes: 15
  session-timeout-minutes: 5
  support-email: support@retailzw.co.zw
  mail:
    from-name: RetailZW
    support-from: support@retailzw.co.zw
    support-password: ${MAIL_SUPPORT_PASSWORD:${MAIL_PASSWORD:cHigwagwa1t}}
    billing-from: sales@retailzw.co.zw
    billing-password: ${MAIL_BILLING_PASSWORD:${MAIL_PASSWORD:cHigwagwa1t}}
    notifications-from: info@retailzw.co.zw
    notifications-password: ${MAIL_NOTIFICATIONS_PASSWORD:${MAIL_PASSWORD:cHigwagwa1t}}
    reply-to: support@retailzw.co.zw

smilepay:
  base-url: https://zbnet.zb.co.zw/wallet_gateway/payments-gateway
  api-key: CHANGE_ME
  api-secret: CHANGE_ME

billing:
  reminder-days: 14,7,3,1,0,-1,-3
  reminder-cron: "0 0 8 * * *"
  grace-days: 3

logging:
  level:
    root: INFO
    com.retailzw: INFO
    com.retailzw.controller.api.ApiExceptionHandler: WARN
    com.retailzw.config.RequestLoggingFilter: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    com.zaxxer.hikari: INFO
    org.flywaydb: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{50} - %msg%n"

  file:
    name: logs/retailzw.log

  logback:
    rollingpolicy:
      file-name-pattern: logs/retailzw-%d{yyyy-MM-dd}.%i.log
      max-file-size: 20MB
      max-history: 30
      total-size-cap: 1GB443224
