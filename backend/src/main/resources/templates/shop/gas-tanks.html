<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/layout :: head('Tanks & Prices')}"></head>
<body>
<div class="app-shell">
  <aside th:replace="~{common/layout :: shopSidebar('gas-tanks')}"></aside>
  <main class="main">
    <nav th:replace="~{common/layout :: shopTopbar('Tanks & Prices')}"></nav>
    <section class="page-hero"><div class="hero-title"><div class="hero-icon"><i class="fa-solid fa-fire-flame-simple"></i></div><div><p>LPG stock setup,</p><h1>Tanks & Prices</h1></div></div></section>
    <div class="page-toolbar">
      <form method="get" th:action="@{/shop/gas/tanks}" class="inline-form"><select name="branchId" onchange="this.form.submit()"><option th:each="b : ${gasBranches}" th:value="${b.id}" th:text="${b.name}" th:selected="${b.id == gasBranchId}">Gas Branch</option></select></form>
      <a class="btn btn-blue" href="#modal-gas-price"><i class="fa-solid fa-tag"></i>Set Price</a>
      <a class="btn btn-primary" href="#modal-gas-tank"><i class="fa-solid fa-plus"></i>Add Tank</a>
    </div>
    <div th:if="${message}" class="alert" th:text="${message}"></div>
    <section class="grid two-col">
      <div class="panel table-panel">
        <div class="toolbar"><h2>Gas Tanks</h2><span class="badge" th:text="${gasTankCount + ' tanks'}">0 tanks</span></div>
        <table><thead><tr><th>Tank</th><th>On Hand</th><th>Capacity</th><th>Reorder</th><th>Status</th><th></th></tr></thead><tbody>
        <tr th:each="t : ${gasTanks}">
          <td><strong th:text="${t.name}">Tank</strong><small th:text="${t.productName}">LPG Gas</small></td>
          <td th:text="${t.currentKg + ' kg'}">0 kg</td><td th:text="${t.capacityKg + ' kg'}">0 kg</td><td th:text="${t.reorderLevelKg + ' kg'}">0 kg</td>
          <td><span th:class="${t.status.name() == 'ACTIVE' ? 'badge status-active' : 'badge status-suspended'}" th:text="${t.status}">ACTIVE</span></td>
          <td><a class="icon-button mini" th:href="${'#modal-gas-tank-' + t.id}" title="Edit"><i class="fa-solid fa-pen"></i></a></td>
        </tr></tbody></table>
      </div>
      <div class="panel table-panel">
        <div class="toolbar"><h2>Active LPG Prices</h2><a class="btn btn-light" href="#modal-gas-price"><i class="fa-solid fa-pen"></i>Update</a></div>
        <table><thead><tr><th>Currency</th><th>Price / kg</th><th>Created</th></tr></thead><tbody>
        <tr th:each="p : ${gasPrices}"><td><span class="badge" th:text="${p.currency}">USD</span></td><td><strong th:text="${p.pricePerKg}">0</strong></td><td th:text="${p.createdAt != null ? #temporals.format(p.createdAt, 'dd MMM yyyy HH:mm') : ''}">Date</td></tr>
        </tbody></table>
      </div>
    </section>
    <div id="modal-gas-tank" class="modal"><div class="modal-content"><div class="modal-head"><h2>Add Gas Tank</h2><a class="close" href="#">&times;</a></div><form method="post" th:action="@{/shop/gas/tanks}" class="form-grid"><input type="hidden" name="branchId" th:value="${gasBranchId}"><input type="hidden" name="returnTo" value="/shop/gas/tanks"><label>Tank Name *<input name="name" required></label><label>Product *<input name="productName" required value="LPG Gas"></label><label>Capacity Kg *<input name="capacityKg" type="number" step="0.001" min="0" required></label><label>Current Kg *<input name="currentKg" type="number" step="0.001" min="0" required></label><label>Reorder Kg *<input name="reorderLevelKg" type="number" step="0.001" min="0" required></label><label>Status<select name="status"><option th:each="s : ${gasTankStatuses}" th:value="${s}" th:text="${s}">ACTIVE</option></select></label><div class="modal-actions"><button class="btn btn-primary" type="submit"><i class="fa-solid fa-floppy-disk"></i>Save Tank</button></div></form></div></div>
    <div th:each="t : ${gasTanks}" th:id="${'modal-gas-tank-' + t.id}" class="modal"><div class="modal-content"><div class="modal-head"><h2 th:text="${'Edit ' + t.name}">Edit Tank</h2><a class="close" href="#">&times;</a></div><form method="post" th:action="@{'/shop/gas/tanks/' + ${t.id} + '/update'}" class="form-grid"><input type="hidden" name="branchId" th:value="${gasBranchId}"><input type="hidden" name="returnTo" value="/shop/gas/tanks"><label>Tank Name *<input name="name" required th:value="${t.name}"></label><label>Product *<input name="productName" required th:value="${t.productName}"></label><label>Capacity Kg *<input name="capacityKg" type="number" step="0.001" min="0" required th:value="${t.capacityKg}"></label><label>Current Kg *<input name="currentKg" type="number" step="0.001" min="0" required th:value="${t.currentKg}"></label><label>Reorder Kg *<input name="reorderLevelKg" type="number" step="0.001" min="0" required th:value="${t.reorderLevelKg}"></label><label>Status<select name="status"><option th:each="s : ${gasTankStatuses}" th:value="${s}" th:text="${s}" th:selected="${t.status == s}">ACTIVE</option></select></label><div class="modal-actions"><button class="btn btn-primary" type="submit"><i class="fa-solid fa-floppy-disk"></i>Update Tank</button></div></form></div></div>
    <div id="modal-gas-price" class="modal"><div class="modal-content"><div class="modal-head"><h2>Set Gas Price</h2><a class="close" href="#">&times;</a></div><form method="post" th:action="@{/shop/gas/prices}" class="form-grid"><input type="hidden" name="branchId" th:value="${gasBranchId}"><input type="hidden" name="returnTo" value="/shop/gas/tanks"><label>Currency *<select name="currency" required><option th:each="c : ${currencies}" th:value="${c}" th:text="${c}">USD</option></select></label><label>Price per kg *<input name="pricePerKg" type="number" step="0.0001" min="0.0001" required></label><div class="modal-actions"><button class="btn btn-primary" type="submit"><i class="fa-solid fa-floppy-disk"></i>Save Price</button></div></form></div></div>
  </main>
</div>
</body>
</html>
