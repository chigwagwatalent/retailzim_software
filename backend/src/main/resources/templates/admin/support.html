<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/layout :: head('Live Support')}"></head>
<body>
<div class="app-shell">
  <aside th:replace="~{common/layout :: platformSidebar('support')}"></aside>
  <main class="main">
    <nav th:replace="~{common/layout :: platformTopbar('Live Support')}"></nav>

    <section class="page-hero">
      <div class="hero-title">
        <div class="hero-icon"><i class="fa-solid fa-headset"></i></div>
        <div>
          <p>Realtime tenant care,</p>
          <h1>Live Support Center</h1>
        </div>
      </div>
      <div class="hero-metrics">
        <div><i class="fa-solid fa-inbox"></i><strong th:text="${totalUnreadSupport}">0</strong><span>Unread Messages</span></div>
        <div><i class="fa-solid fa-store"></i><strong th:text="${#lists.size(tenants)}">0</strong><span>Tenant Channels</span></div>
      </div>
    </section>

    <div th:if="${message}" class="alert" th:text="${message}"></div>

    <section class="support-console">
      <aside class="support-inbox">
        <div class="panel-title-row">
          <div>
            <p class="eyebrow">Inbox</p>
            <h2>Tenant Conversations</h2>
          </div>
        </div>
        <a th:each="t : ${tenants}"
           th:href="@{/admin/support(tenantId=${t.id})}"
           th:class="${selectedTenantId != null and selectedTenantId == t.id ? 'support-thread active' : 'support-thread'}">
          <span class="thread-avatar" th:text="${#strings.substring(t.companyName,0,1)}">T</span>
          <span>
            <strong th:text="${t.companyName}">Tenant</strong>
            <small th:if="${lastMessageByTenant.get(t.id) != null}" th:text="${lastMessageByTenant.get(t.id).message}">Last message</small>
            <small th:if="${lastMessageByTenant.get(t.id) == null}">No messages yet</small>
          </span>
          <em th:if="${unreadByTenant.get(t.id) != null and unreadByTenant.get(t.id) > 0}" th:text="${unreadByTenant.get(t.id)}">0</em>
        </a>
      </aside>

      <section class="support-room chat-panel" th:if="${selectedTenant != null}" th:attr="data-feed-url=@{/admin/support/{id}/chat/feed(id=${selectedTenant.id})}">
        <div class="support-room-head">
          <div>
            <p class="eyebrow">Active channel</p>
            <h2 th:text="${selectedTenant.companyName}">Tenant</h2>
            <small th:text="${selectedTenant.email + ' · ' + selectedTenant.status}">email</small>
          </div>
          <div class="support-room-actions">
            <a class="btn btn-light" th:href="@{/admin/tenants/{id}(id=${selectedTenant.id})}"><i class="fa-solid fa-chart-line"></i>Tenant Detail</a>
            <a class="btn btn-blue" th:href="@{/admin/tenants/{id}#modal-announce(id=${selectedTenant.id})}"><i class="fa-solid fa-bullhorn"></i>Announce</a>
          </div>
        </div>

        <div class="chat-feed support-room-feed">
          <article th:each="m : ${chatMessages}" th:class="${m.senderType.name() == 'PLATFORM' ? 'chat-message platform' : 'chat-message shop'}">
            <strong th:text="${m.senderName}">Sender</strong>
            <p th:text="${m.message}">Message</p>
            <small th:text="${m.createdAt != null ? #temporals.format(m.createdAt, 'dd MMM yyyy HH:mm') : ''}">time</small>
          </article>
          <div class="empty" th:if="${#lists.isEmpty(chatMessages)}">No support messages yet.</div>
        </div>

        <form method="post" th:action="@{/admin/support/{id}/chat(id=${selectedTenant.id})}" class="chat-form support-compose" data-async-chat>
          <input name="message" required placeholder="Reply as platform support">
          <button class="btn btn-primary" type="submit"><i class="fa-solid fa-paper-plane"></i>Send Reply</button>
        </form>
      </section>

      <section class="support-room empty" th:if="${selectedTenant == null}">
        No tenants are available for support yet.
      </section>
    </section>
  </main>
</div>
</body>
</html>
