<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset RetailZW Admin Password</title>
  <link rel="stylesheet" th:href="@{/css/retailzw.css(v=24)}">
  <link rel="stylesheet" th:href="@{/css/auth-clean.css(v=5)}">
  <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.4.2/css/all.min.css}">
  <script defer th:src="@{/js/retailzw.js(v=17)}"></script>
</head>
<body class="auth-shell">
  <div class="auth-preloader" data-auth-preloader>
    <div class="auth-preloader-card"><span class="auth-preloader-logo"><img th:src="@{/img/logo.png}" alt="RetailZW"></span><strong>RetailZW</strong><small>Opening admin recovery</small><i></i></div>
  </div>
  <form class="auth-card login-card" method="post" th:action="@{/auth/admin/forgot}" onsubmit="this.classList.add('is-loading')">
    <div class="auth-logo-center"><img th:src="@{/img/logo.png}" alt="RetailZW"></div>
    <div class="auth-copy"><p>Platform recovery</p><h1>Reset password</h1><span>Enter your platform admin email or username.</span></div>
    <div th:if="${message}" class="alert" th:text="${message}"></div>
    <label class="auth-field">Email or username
      <span class="auth-input-shell"><i class="fa-regular fa-envelope"></i><input name="email" type="text" autocomplete="username" required placeholder="admin@retailzw.co.zw"></span>
    </label>
    <button class="btn btn-primary auth-submit" type="submit"><span>Send reset link</span><i></i></button>
    <p class="auth-switch"><a th:href="@{/auth/admin/login}">Back to login</a></p>
  </form>
</body>
</html>
