<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset RetailZW Admin Password</title>
  <link rel="stylesheet" th:href="@{/css/retailzw.css(v=45)}">
</head>
<body class="auth-shell">
  <form class="auth-card login-card" method="post" th:action="@{/auth/admin/forgot}" onsubmit="this.classList.add('is-loading')">
    <div class="auth-logo-wrap">
      <img class="auth-logo" th:src="@{/img/retail-zim-logo-transparent.png}" alt="Retail Zim">
    </div>
    <div class="auth-copy">
      <h1>Reset access</h1>
      <span>Enter your platform admin email or username.</span>
    </div>
    <div th:if="${message}" class="alert" th:text="${message}"></div>
    <label>Email or username <input name="email" type="text" autocomplete="username" required></label>
    <button class="btn btn-primary auth-submit" type="submit"><span>Send reset link</span><i></i></button>
    <div class="auth-progress" aria-hidden="true"><span></span></div>
    <small class="auth-loading-text">Sending reset link...</small>
    <p class="auth-switch"><a th:href="@{/auth/admin/login}">Back to login</a></p>
  </form>
</body>
</html>
