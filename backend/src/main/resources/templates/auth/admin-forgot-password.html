<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset RetailZW Admin Password</title>
  <link rel="stylesheet" th:href="@{/css/retailzw.css(v=16)}">
</head>
<body class="auth-shell">
  <form class="auth-card" method="post" th:action="@{/auth/admin/forgot}">
    <div class="brand"><span class="brand-mark">RZ</span><span>RetailZW SaaS Admin</span></div>
    <h1>Reset password</h1>
    <p>Enter your platform admin email or username.</p>
    <div th:if="${message}" class="alert" th:text="${message}"></div>
    <label>Email or username <input name="email" type="text" autocomplete="username" required></label>
    <button class="btn btn-primary" type="submit">Send reset link</button>
    <p class="auth-switch"><a th:href="@{/auth/admin/login}">Back to login</a></p>
  </form>
</body>
</html>
