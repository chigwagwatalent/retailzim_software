<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RetailZW Shop Admin</title>
  <link rel="stylesheet" th:href="@{/css/retailzw.css(v=16)}">
  <link rel="stylesheet" th:href="@{/css/auth-clean.css}">
  <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.4.2/css/all.min.css}">
  <script defer th:src="@{/js/retailzw.js}"></script>
</head>
<body class="auth-shell">
  <div class="auth-preloader" data-auth-preloader>
    <div class="auth-preloader-card">
      <span class="brand-mark"><span></span></span>
      <strong>RetailZW</strong>
      <small>Opening retail workspace</small>
      <i></i>
    </div>
  </div>

  <form class="auth-card login-card" method="post" th:action="@{/auth/shop/login}" onsubmit="this.classList.add('is-loading')">
    <div class="auth-orbit" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="brand auth-brand"><span class="brand-mark"><span></span></span><span>RetailZW</span></div>
    <div class="auth-copy">
      <p>Shop command centre</p>
      <h1>Welcome back</h1>
      <span>Fast, clean retail control for every branch.</span>
    </div>
    <div th:if="${param.error}" class="alert">Invalid username or password.</div>
    <label class="auth-field">Username
      <span class="auth-input-shell">
        <i class="fa-regular fa-user"></i>
        <input name="username" autocomplete="username" required placeholder="admin">
      </span>
    </label>
    <label class="auth-field">Password
      <span class="auth-input-shell">
        <i class="fa-solid fa-key"></i>
        <input id="shopLoginPassword" name="password" type="password" autocomplete="current-password" required placeholder="Password">
        <button class="auth-ghost-button" type="button" data-password-toggle="shopLoginPassword" aria-label="Show password">
          <i class="fa-regular fa-eye"></i>
        </button>
      </span>
    </label>
    <button class="btn btn-primary auth-submit" type="submit"><span>Sign in</span><i></i></button>
    <div class="auth-link-row">
      <a th:href="@{/auth/shop/forgot}">Forgot password?</a>
      <span>New shop? <a th:href="@{/auth/signup}">Create account</a></span>
    </div>
  </form>
</body>
</html>
