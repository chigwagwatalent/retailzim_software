<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RetailZW Shop Admin</title>
  <link rel="stylesheet" th:href="@{/css/retailzw.css(v=18)}">
  <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.4.2/css/all.min.css}">
  <script defer th:src="@{/js/retailzw.js(v=17)}"></script>
</head>
<body class="auth-shell">
  <form class="auth-card login-card" method="post" th:action="@{/auth/shop/login}" onsubmit="this.classList.add('is-loading')">
    <div class="auth-orbit" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="auth-logo-wrap">
      <img class="auth-logo" th:src="@{/img/retail-zim-logo-transparent.png}" alt="Retail Zim">
    </div>
    <div class="auth-copy">
      <h1>Welcome back</h1>
      <span>Access your Retail Zim shop workspace.</span>
    </div>
    <div th:if="${param.error}" class="alert">Invalid username or password.</div>
    <label class="auth-field">Username
      <span class="auth-input-shell">
        <i class="fa-regular fa-user"></i>
        <input name="username" autocomplete="username" required>
      </span>
    </label>
    <label class="auth-field">Password
      <span class="auth-input-shell">
        <i class="fa-solid fa-key"></i>
        <input id="shopLoginPassword" name="password" type="password" autocomplete="current-password" required>
        <button class="auth-ghost-button" type="button" data-password-toggle="shopLoginPassword" aria-label="Show password">
          <i class="fa-regular fa-eye"></i>
        </button>
      </span>
    </label>
    <button class="btn btn-primary auth-submit" type="submit"><span>Sign in</span><i></i></button>
    <div class="auth-progress" aria-hidden="true"><span></span></div>
    <small class="auth-loading-text">Signing in securely...</small>
    <div class="auth-link-row">
      <a th:href="@{/auth/shop/forgot}">Forgot password?</a>
      <span>New shop? <a th:href="@{/auth/signup}">Create account</a></span>
    </div>
  </form>
</body>
</html>
