<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset RetailZW Password</title>
  <link rel="stylesheet" th:href="@{/css/retailzw.css(v=16)}">
</head>
<body class="auth-shell">
  <form class="auth-card login-card" method="post" th:action="@{/auth/shop/forgot}">
    <div class="brand auth-brand"><span class="brand-mark"><span></span></span><span>RetailZW</span></div>
    <div class="auth-copy">
      <p>Password recovery</p>
      <h1>Reset access</h1>
      <span>Enter the email or username connected to your shop account.</span>
    </div>
    <div th:if="${message}" class="alert" th:text="${message}"></div>
    <label>Email or username <input name="email" type="text" autocomplete="username" required placeholder="you@shop.co.zw"></label>
    <button class="btn btn-primary auth-submit" type="submit"><span>Send reset link</span><i></i></button>
    <p class="auth-switch"><a th:href="@{/auth/shop/login}">Back to login</a></p>
  </form>
</body>
</html>
