<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set New Password</title>
  <link rel="stylesheet" th:href="@{/css/retailzw.css(v=24)}">
  <link rel="stylesheet" th:href="@{/css/auth-clean.css(v=5)}">
  <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.4.2/css/all.min.css}">
  <script defer th:src="@{/js/retailzw.js(v=17)}"></script>
</head>
<body class="auth-shell">
  <div class="auth-preloader" data-auth-preloader>
    <div class="auth-preloader-card"><span class="auth-preloader-logo"><img th:src="@{/img/logo.png}" alt="RetailZW"></span><strong>RetailZW</strong><small>Securing your account</small><i></i></div>
  </div>
  <form class="auth-card login-card" method="post" th:action="${resetAction}" onsubmit="this.classList.add('is-loading')">
    <div class="auth-logo-center"><img th:src="@{/img/logo.png}" alt="RetailZW"></div>
    <div class="auth-copy">
      <p>Secure reset</p>
      <h1>New password</h1>
      <span>Use at least 8 characters.</span>
    </div>
    <div th:if="${message}" class="alert" th:text="${message}"></div>
    <input type="hidden" name="token" th:value="${token}">
    <label class="auth-field">New Password
      <span class="auth-input-shell"><i class="fa-solid fa-key"></i><input id="resetPassword" name="password" type="password" minlength="8" autocomplete="new-password" required placeholder="New secure password"><button class="auth-ghost-button" type="button" data-password-toggle="resetPassword" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></span>
    </label>
    <button class="btn btn-primary auth-submit" type="submit"><span>Update password</span><i></i></button>
  </form>
</body>
</html>
