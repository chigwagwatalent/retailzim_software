<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set New Password</title>
  <link rel="stylesheet" th:href="@{/css/retailzw.css(v=16)}">
</head>
<body class="auth-shell">
  <form class="auth-card login-card" method="post" th:action="${resetAction}">
    <div class="brand auth-brand"><span class="brand-mark"><span></span></span><span>RetailZW</span></div>
    <div class="auth-copy">
      <p>Secure reset</p>
      <h1>New password</h1>
      <span>Use at least 8 characters.</span>
    </div>
    <div th:if="${message}" class="alert" th:text="${message}"></div>
    <input type="hidden" name="token" th:value="${token}">
    <label>New Password <input name="password" type="password" minlength="8" autocomplete="new-password" required></label>
    <button class="btn btn-primary auth-submit" type="submit"><span>Update password</span><i></i></button>
  </form>
</body>
</html>
