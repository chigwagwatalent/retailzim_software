<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RetailZW SaaS Admin</title>
  <link rel="stylesheet" th:href="@{/css/retailzw.css(v=18)}">
</head>
<body class="auth-shell">
  <form class="auth-card login-card" method="post" th:action="@{/auth/admin/login}" onsubmit="this.classList.add('is-loading')">
    <div class="auth-logo-wrap">
      <img class="auth-logo" th:src="@{/img/retail-zim-logo-transparent.png}" alt="Retail Zim">
    </div>
    <div class="auth-copy">
      <h1>Platform sign in</h1>
      <span>Access your Retail Zim admin workspace.</span>
    </div>
    <div th:if="${param.error}" class="alert">Invalid platform login.</div>
    <label>Username <input name="username" required></label>
    <label>Password <input name="password" type="password" required></label>
    <button class="btn btn-primary auth-submit" type="submit"><span>Sign in</span><i></i></button>
    <div class="auth-progress" aria-hidden="true"><span></span></div>
    <small class="auth-loading-text">Signing in securely...</small>
    <p class="auth-switch"><a th:href="@{/auth/admin/forgot}">Forgot password?</a></p>
  </form>
</body>
</html>
